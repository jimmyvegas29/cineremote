name: Build

# Every push / pull request builds and smoke-tests all platforms. Pushing a tag vX.Y.Z (matching
# cineremote/__init__.py) publishes a GitHub Release with the installers, the OBS plugins and
# SHA256SUMS.txt - the in-app updater reads exactly those file names.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PYINSTALLER: "pyinstaller==6.22.2"
  OBS_VER: "32.1.2"
  QT_QPA_PLATFORM: offscreen      # smoke tests run the real app without a display

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Version
        shell: bash
        run: echo "VERSION=$(python -c 'import cineremote; print(cineremote.__version__)')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.txt ${{ env.PYINSTALLER }}
      - name: Smoke test (source)
        shell: bash
        run: python cineremote.py --demo --quit-after 6
      - name: Build OBS plugin and virtual webcam
        shell: cmd
        run: |
          call obs-plugin\build.bat || exit /b 1
          call vcam\build.bat || exit /b 1
      - name: Bundle app
        run: pyinstaller packaging/cineremote.spec --noconfirm
      - name: Smoke test (bundle)
        shell: pwsh
        run: |
          $p = Start-Process dist\CineRemote\CineRemote.exe -ArgumentList "--demo","--quit-after","8" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "bundled app exited with $($p.ExitCode)" }
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$env:VERSION" packaging\windows\cineremote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: OBS plugin zip
        shell: pwsh
        run: |
          $d = "build\obs\cineremote-obs"
          New-Item -ItemType Directory -Force "$d\bin\64bit", "$d\data\locale" | Out-Null
          Copy-Item obs-plugin\out\cineremote-obs.dll "$d\bin\64bit\"
          Copy-Item packaging\windows\en-US.ini "$d\data\locale\"
          Compress-Archive -Path $d -DestinationPath "dist\cineremote-obs-$env:VERSION-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-22.04        # oldest supported glibc = widest compatibility for the AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: System packages (Qt runtime libs, OBS headers from the obsproject PPA)
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends obs-studio build-essential libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libegl1 libgl1 libpulse0 libfontconfig1 libdbus-1-3
      - name: Version
        run: echo "VERSION=$(python -c 'import cineremote; print(cineremote.__version__)')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.txt ${{ env.PYINSTALLER }}
      - name: Smoke test (source)
        run: python cineremote.py --demo --quit-after 6
      - name: OBS plugin
        run: |
          bash obs-plugin/build_linux.sh
          d=build/obs/cineremote-obs
          mkdir -p "$d/bin/64bit" "$d/data/locale"
          cp obs-plugin/out/cineremote-obs.so "$d/bin/64bit/"
          echo 'CineRemote Camera="CineRemote Camera"' > "$d/data/locale/en-US.ini"
          mkdir -p dist && tar -C build/obs -czf "dist/cineremote-obs-$VERSION-linux-x86_64.tar.gz" cineremote-obs
      - name: Bundle app + AppImage
        run: |
          pyinstaller packaging/cineremote.spec --noconfirm
          bash packaging/linux/build_appimage.sh
      - name: Smoke test (AppImage)
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/CineRemote-$VERSION-linux-x86_64.AppImage" --demo --quit-after 8
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Version
        run: echo "VERSION=$(python -c 'import cineremote; print(cineremote.__version__)')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.txt ${{ env.PYINSTALLER }}
      - name: Smoke test (source)
        run: python cineremote.py --demo --quit-after 6
      - name: Bundle app
        run: bash packaging/macos/build_app.sh
      - name: Smoke test (bundle)
        run: dist/CineRemote.app/Contents/MacOS/CineRemote --demo --quit-after 8
      - name: OBS plugin (universal, built once)
        if: matrix.arch == 'arm64'
        run: |
          OBS_UNIVERSAL=1 bash obs-plugin/build_macos.sh
          lipo -archs obs-plugin/out/cineremote-obs.plugin/Contents/MacOS/cineremote-obs
          ditto -c -k --keepParent obs-plugin/out/cineremote-obs.plugin "dist/cineremote-obs-$VERSION-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches __version__
        run: |
          v=$(python3 -c 'import cineremote; print(cineremote.__version__)')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != __version__ $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums + release notes
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          # the CHANGELOG section for this version becomes the release notes (shown by the in-app updater)
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v || $2 == "v"v || $2 == "["v"]")} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CineRemote ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: CineRemote ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
